[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-style-finder"
version = "1.0.0"
description = "Multimodal RAG fashion style finder using ResNet50, ChromaDB, and Llama 4 Vision."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Multimodal Style Finder" }]
dependencies = [
  "ibm-watsonx-ai==1.1.20",
  "requests==2.32.0",
  "pillow==11.0.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "chromadb==0.6.3",
  "gradio==5.22.0",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0"]

[tool.setuptools.packages.find]
include = ["style_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
